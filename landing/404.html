<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Klipr</title>
    <link rel="icon" href="./assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 56px 40px;
            max-width: 500px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-message {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <div class="bg-ambient" aria-hidden="true">
        <div class="glow-orb glow-top-center"></div>
    </div>

    <div class="container error-container">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 style="font-size: 1.5rem; margin-bottom: 12px; font-weight: 700;">Page Not Found</h1>
            <p class="error-message">The page or resource you are looking for does not exist.</p>
            <a href="./" class="btn btn-primary">
                <svg class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Return to Home
            </a>
        </div>
    </div>
</body>
</html>
