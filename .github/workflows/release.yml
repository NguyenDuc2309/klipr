name: Release

# Fires only on a version tag pushed by scripts/release.sh — never on plain merges.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  verify:
    name: Tag matches app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with setting.json and snapcraft.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python3 -c "import json; print(json.load(open('setting.json'))['version'])")
          snap=$(sed -n "s/^version: *'\{0,1\}\([^']*\)'\{0,1\}$/\1/p" snap/snapcraft.yaml)
          echo "tag=$tag setting.json=$app snapcraft.yaml=$snap"
          [ "$tag" = "$app" ] && [ "$tag" = "$snap" ] || {
            echo "::error::Version mismatch — run scripts/release.sh instead of tagging by hand"; exit 1; }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klipr-deb

      - name: Checksums
        run: sha256sum klipr_*_all.deb > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" klipr_*_all.deb SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest
